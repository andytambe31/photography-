<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>a6700 Photo School</title>
  <meta name="description" content="A hands-on photography course built around the Sony a6700: exposure, autofocus, color, composition, genre recipes and video.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23e8a33d'/><circle cx='50' cy='50' r='24' fill='%23161412'/><circle cx='42' cy='42' r='7' fill='%23fff' opacity='.7'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a href="#/" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><circle cx="16" cy="16" r="8.5" fill="#15120f"/><circle cx="13" cy="13" r="2.6" fill="#fff" opacity=".75"/></svg>
      <span>a6700 <em>Photo School</em></span>
    </a>
    <div class="top-progress" title="Course progress">
      <div class="top-progress-track"><div class="top-progress-fill" id="progressFill"></div></div>
      <span id="progressPill">0%</span>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
    </button>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Course navigation"></nav>
    <div class="scrim" id="scrim"></div>
    <main id="app" tabindex="-1"></main>
  </div>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
